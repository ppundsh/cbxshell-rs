[package]
name = "cbx-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-user file association and settings manager GUI for cbxshell-rs"

[[bin]]
name = "cbx-manager"
path = "src/main.rs"

[dependencies]
cbx-core = { path = "../cbx-core" }
windows.workspace = true
windows-core.workspace = true
# Ed25519 (minisign) verification of downloaded installers; pure Rust, no dependencies.
minisign-verify = "0.2"
# Ed25519 check of the maintainer's YubiKey (FIDO2) release approval; pure Rust, no dependencies.
ed25519-compact = { version = "2", default-features = false }
