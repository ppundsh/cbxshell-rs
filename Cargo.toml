[workspace]
resolver = "2"
members = [
    "crates/cbx-core",
    "crates/cbxshell",
    "crates/cbx-manager",
    "crates/cbx-cli",
    "crates/cbx-installer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["cbxshell-rs contributors"]
repository = "https://github.com/ppundsh/cbxshell-rs"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "tiff",
    "ico",
    "webp",
    "hdr",
    "exr",
    "qoi",
    "dds",
    "tga",
    "pnm",
    "ff",
] }
image-webp = "0.2"
jxl-oxide = { version = "0.12", default-features = false, features = ["image", "moxcms"] }
zip = { version = "2.6", default-features = false, features = ["deflate", "deflate64", "lzma", "aes-crypto"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "lz4", "ppmd"] }
rar-codec = { version = "0.1.10", features = ["std"] }
tar = "0.4"
quick-xml = "0.37"
windows = { version = "0.58", features = [
    "implement",
    "Data_Pdf",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Storage",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
